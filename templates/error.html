{% extends "base.html" %}
{% block title %}{{ code }} ERROR{% endblock %}
{% block content %}
<section class="error-page panel">
  <div class="error-code">{{ code }}</div>
  <h1>Something went wrong</h1>
  <p>{{ message }}</p>
  <a class="button button-primary" href="{{ url_for('index') }}">Return to homepage</a>
</section>
{% endblock %}
